services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tick_tack
      POSTGRES_USER: tick_tack
      POSTGRES_PASSWORD: tick_tack
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tick_tack -d tick_tack"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
