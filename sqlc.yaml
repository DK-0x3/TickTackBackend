version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: sql/queries
    gen:
      go:
        package: sqlc
        out: internal/platform/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            nullable: false
            go_type:
              import: uuid
              type: UUID
